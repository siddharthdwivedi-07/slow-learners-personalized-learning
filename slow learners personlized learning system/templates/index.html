{% extends "base.html" %}

{% block content %}
    <div class="section-head">
        <h1>Welcome to your learning companion</h1>
        <p>Answer a few questions so we can check whether you need targeted support or general tips.</p>
    </div>

    <form method="post" class="form-panel">
        {% for question in questions %}
            <div class="form-row">
                <label>{{ loop.index }}. {{ question }}</label>
                <div class="radio-group">
                    <label><input type="radio" name="question_{{ loop.index0 }}" value="yes" required> Yes</label>
                    <label><input type="radio" name="question_{{ loop.index0 }}" value="no"> No</label>
                </div>
            </div>
        {% endfor %}

        <button type="submit" class="primary-button">Check My Learning Needs</button>
    </form>
{% endblock %}
